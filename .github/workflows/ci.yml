name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify no package has moved off the 0.x track
        run: pnpm check-versions

      - name: Verify create-stax-ui templates are in sync with workspace versions
        run: |
          pnpm sync-template-versions
          if ! git diff --quiet; then
            echo "::error::create-stax-ui templates are out of sync with workspace versions."
            echo "::error::Run 'pnpm sync-template-versions' and commit the diff:"
            git diff
            exit 1
          fi

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test -- --run
