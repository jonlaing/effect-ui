name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify no package has moved off the 0.x track
        run: pnpm check-versions

      - run: pnpm typecheck

      - run: pnpm build

      - name: Verify create-stax-ui templates still build
        run: pnpm build:templates

      - run: pnpm test -- --run
